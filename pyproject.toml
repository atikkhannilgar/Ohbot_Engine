[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obot"
version = "1.0.0"
description = "Voice pipeline for the OhBot chatbot robot: streams LLM responses, parses action/emotion markers, and drives speech and servo motion in real time."
readme = "README.md"
requires-python = ">=3.12"

dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Typed sessions, desktop protocol, model HTTP clients and device enumeration.
# Speech synthesis, SSH, robot drivers and training are separate installations.
desktop = ["websockets>=14", "httpx>=0.27", "sounddevice>=0.4.6", "SpeechRecognition>=3.10"]
voice = ["pyttsx3>=2.90; sys_platform != 'darwin'", "comtypes>=1.4; sys_platform == 'win32'"]
ssh = ["sshtunnel>=0.4", "paramiko>=3.4,<4"]
hardware = ["ohbot>=4.0", "pyserial>=3.5"]
ml = ["torch>=2.2", "scipy>=1.11", "soundfile>=0.12", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
